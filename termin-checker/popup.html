<!doctype html>
<meta charset="utf-8">
<title>RK-Termin Checker</title>
<style>
  body { font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         width: 300px; margin: 0; padding: 14px; color: #202124; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .state { padding: 10px; border-radius: 8px; background: #f1f3f4; margin-bottom: 12px; }
  .state.good { background: #e6f4ea; color: #0b6b33; }
  .big { font-weight: 700; font-size: 15px; }
  ul { list-style: none; margin: 6px 0 0; padding: 0; }
  li { font-weight: 600; }
  .when { color: #5f6368; font-size: 11px; margin-top: 6px; }
  .stats { border: 1px solid #dadce0; border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
  .stat { display: flex; justify-content: space-between; padding: 7px 10px; border-bottom: 1px solid #f1f3f4; }
  .stat:last-child { border-bottom: 0; }
  .stat .k { color: #5f6368; }
  .stat .v { font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat.hit .v { color: #137333; }
  .stat.miss .v { color: #c5221f; }
  .rate { padding: 7px 10px; background: #f8f9fa; color: #5f6368; font-size: 11px; }
  .rate.warn { background: #fce8e6; color: #c5221f; }
  button { width: 100%; padding: 9px; border-radius: 6px; border: 1px solid #1a73e8;
           background: #1a73e8; color: #fff; font-weight: 600; cursor: pointer; margin-bottom: 6px; }
  button.ghost { background: #fff; color: #1a73e8; }
  button.tiny { font-size: 11px; padding: 6px; border-color: #dadce0; color: #5f6368; background: #fff; }
  @media (prefers-color-scheme: dark) {
    body { background: #202124; color: #e8eaed; }
    .state { background: #292a2d; } .state.good { background: #1e3a29; color: #81c995; }
    .stats { border-color: #3c4043; } .stat { border-bottom-color: #292a2d; }
    .rate { background: #292a2d; } .rate.warn { background: #3d2220; color: #f28b82; }
    button.ghost, button.tiny { background: #202124; }
    button.tiny { border-color: #3c4043; color: #9aa0a6; }
  }
</style>
<h1>RK-Termin Checker</h1>
<div class="state" id="state">No check yet.</div>
<div class="stats" id="stats"></div>
<button id="open">Open appointment page</button>
<button class="ghost" id="opts">Settings</button>
<button class="tiny" id="reset">Reset counters</button>
<script src="popup.js"></script>
